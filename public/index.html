<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercover Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1, h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
    input, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: none; font-size: 16px; }
    input { background: #334155; color: white; border: 1px solid #475569; }
    button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .secondary-btn { background: #475569; }
    .secondary-btn:hover { background: #334155; }
    .hidden { display: none !important; }
    ul { list-style: none; margin-bottom: 16px; }
    li { background: #334155; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .secret-box { background: #0284c7; padding: 20px; text-align: center; border-radius: 12px; margin-bottom: 20px; font-weight: bold; font-size: 20px; }
    .active-turn { border: 2px solid #38bdf8; background: #0284c7; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🕵️ UNDERCOVER</h1>

    <!-- VIEW 1: AUTH / JOIN -->
    <div id="auth-view">
      <input type="text" id="username" placeholder="Your Nickname">
      <button onclick="createRoom()">Create New Game</button>
      <input type="text" id="room-code-input" placeholder="Room Code (e.g. ABCD)">
      <button class="secondary-btn" onclick="joinRoom()">Join Game</button>
    </div>

    <!-- VIEW 2: LOBBY -->
    <div id="lobby-view" class="hidden">
      <h2>Room Code: <span id="display-room-code" style="color:#f59e0b"></span></h2>
      <ul id="player-list"></ul>
      <button id="start-btn" class="hidden" onclick="startGame()">Start Game</button>
      <p id="waiting-msg" style="text-align: center; color: #94a3b8;">Waiting for host to start...</p>
    </div>

    <!-- VIEW 3: GAMEPLAY -->
    <div id="game-view" class="hidden">
      <div id="secret-word-card" class="secret-box">Tap to reveal secret word</div>
      <h2>Turn Order</h2>
      <ul id="turn-list"></ul>
      <button id="next-turn-btn" onclick="nextTurn()">Next Player Clue</button>
    </div>

    <!-- VIEW 4: VOTING -->
    <div id="voting-view" class="hidden">
      <h2>Vote to Eliminate</h2>
      <div id="vote-buttons"></div>
    </div>

    <!-- VIEW 5: GAME OVER -->
    <div id="gameover-view" class="hidden">
      <h2 id="winner-text"></h2>
      <p id="eliminated-text" style="text-align: center; margin-bottom: 15px;"></p>
      <button onclick="location.reload()">Back to Lobby</button>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
