<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercover Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">

    <!-- PAGE 1: FRONT PAGE -->
    <div id="page-1" class="page active">
      <div class="logo-container">
        <div class="logo-title">UNDER<br>COVER</div>
      </div>
      <div class="play-card-btn" onclick="navigateTo('page-2')">
        <div class="play-icon"></div>
      </div>
    </div>

    <!-- PAGE 2: GAME SETUP PAGE -->
    <div id="page-2" class="page">
      <div class="header-bar">
        <div></div>
        <div class="groups-badge" onclick="navigateTo('page-3')">
          <div class="groups-icon">👥</div>
          <span class="groups-label">Groups</span>
        </div>
      </div>

      <div class="player-count-title" id="setup-player-count">Players: 5</div>

      <div class="role-card-box">
        <!-- Civilians -->
        <div class="counter-row">
          <div></div>
          <div class="pill-btn pill-civilians" id="label-civilians">3 Civilians</div>
          <div></div>
        </div>

        <!-- Undercover -->
        <div class="counter-row">
          <button class="counter-btn" onclick="adjustRole('undercover', -1)">-</button>
          <div class="pill-btn pill-undercover" id="label-undercover">1 Undercover</div>
          <button class="counter-btn" onclick="adjustRole('undercover', 1)">+</button>
        </div>

        <!-- Mr. White -->
        <div class="counter-row">
          <button class="counter-btn" onclick="adjustRole('mrWhite', -1)">-</button>
          <div class="pill-btn pill-mrwhite" id="label-mrwhite">1 Mr. White</div>
          <button class="counter-btn" onclick="adjustRole('mrWhite', 1)">+</button>
        </div>
      </div>

      <button class="primary-btn" onclick="startGame()">Start</button>
    </div>

    <!-- PAGE 3: SELECT GROUP PAGE -->
    <div id="page-3" class="page">
      <div class="header-bar">
        <h2 class="section-title">Groups</h2>
        <button class="icon-btn add-btn" onclick="openCreateGroup()">＋</button>
      </div>
      <p class="subtitle">Select or edit player groups for your game.</p>

      <div id="groups-container"></div>

      <button class="icon-btn close-floating-btn" onclick="navigateTo('page-2')">✕</button>
    </div>

    <!-- PAGE 4: EDIT / CREATE GROUP PAGE -->
    <div id="page-4" class="page">
      <div class="header-bar">
        <button class="icon-btn" onclick="navigateTo('page-3')">←</button>
        <input type="text" id="edit-group-name" value="New Group" class="group-name-input">
        <div></div>
      </div>

      <div class="edit-card-box">
        <h4 class="edit-subtitle">Add, remove or reorder players</h4>
        
        <div id="edit-players-list" class="player-list-edit"></div>

        <div class="add-player-row" onclick="addPlayerToGroup()">
          <div class="counter-btn add-icon-bg">+</div>
          <span style="font-weight: 700;">Add new player</span>
        </div>

        <button class="primary-btn save-btn" onclick="saveGroupChanges()">Save changes</button>
      </div>
    </div>

    <!-- PAGE 5: CARD SELECTION -->
    <div id="page-5" class="page">
      <div class="header-bar picker-header">
        <h3 id="current-picker-name" class="picker-name">Shivam</h3>
        <p class="picker-subtitle">Please pick a card</p>
      </div>

      <div class="cards-grid" id="cards-grid"></div>
    </div>

    <!-- SECRET WORD REVEAL MODAL -->
    <div class="modal-overlay" id="card-modal">
      <div class="modal-card">
        <div class="avatar-bubble modal-avatar" id="modal-avatar">S</div>
        <h3 id="modal-player-name" class="modal-player-title">Shivam</h3>
        <p class="modal-subtitle">Your secret word is</p>
        
        <div class="secret-word-box" id="modal-secret-word">SHOWER</div>

        <button class="primary-btn modal-ok-btn" onclick="closeCardModal()">OK</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
